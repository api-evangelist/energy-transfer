openapi: 3.1.0
info:
  title: Energy Transfer Messenger+ Nominations Pipelines API
  description: The Energy Transfer Messenger+ API provides programmatic access to Energy Transfer's pipeline messaging and gas scheduling platform. The API enables partners and shippers to manage gas nominations, scheduling, and pipeline capacity through automated integrations, reducing processing times from 90 minutes to approximately 12 minutes.
  version: '1.0'
servers:
- url: https://dev.messenger.energytransfer.com
tags:
- name: Pipelines
  description: Retrieve pipeline information and status.
paths:
  /pipelines:
    get:
      operationId: listPipelines
      summary: List pipelines
      description: Retrieves a list of Energy Transfer pipelines with capacity, status, and operational details.
      tags:
      - Pipelines
      responses:
        '200':
          description: Success
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
